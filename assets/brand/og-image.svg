<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="DejaVu Sans, Inter, sans-serif">
    <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#4F46E5"/>
        </linearGradient>
        <radialGradient id="glow" cx="18%" cy="22%" r="70%">
            <stop offset="0%" stop-color="#0E7490" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#070B12" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0V48" fill="none" stroke="#26344F" stroke-width="1" stroke-opacity="0.45"/>
        </pattern>
    </defs>

    <rect width="1200" height="630" fill="#070B12"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>

    <!-- Brand mark -->
    <rect x="80" y="88" width="112" height="112" rx="26" fill="url(#brand)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M136 116 104 132l32 16 32-16-32-16Z"/>
        <path d="M104 164l32 16 32-16"/>
        <path d="M104 148l32 16 32-16"/>
    </g>

    <text x="216" y="140" fill="#F8FAFC" font-size="58" font-weight="bold" letter-spacing="6">NEXUS</text>
    <text x="218" y="182" fill="#67E8F9" font-size="21" letter-spacing="5">AI INTELLIGENCE PLATFORM</text>

    <text x="82" y="292" fill="#E2E8F0" font-size="34" font-weight="bold">Four analyst modules. One static, client-side app.</text>
    <text x="82" y="336" fill="#94A3B8" font-size="22">Web-grounded OSINT briefings, structured signal extraction, visual</text>
    <text x="82" y="368" fill="#94A3B8" font-size="22">intelligence and an interactive analyst — powered by the Gemini API.</text>

    <!-- Module chips -->
    <g font-size="20" fill="#A5F3FC">
        <rect x="82" y="424" width="248" height="60" rx="16" fill="#0D131F" stroke="#26344F"/>
        <text x="106" y="462">01 · OSINT Briefing</text>

        <rect x="350" y="424" width="248" height="60" rx="16" fill="#0D131F" stroke="#26344F"/>
        <text x="374" y="462">02 · Signal Matrix</text>

        <rect x="618" y="424" width="248" height="60" rx="16" fill="#0D131F" stroke="#26344F"/>
        <text x="642" y="462">03 · Visual Intel</text>

        <rect x="886" y="424" width="248" height="60" rx="16" fill="#0D131F" stroke="#26344F"/>
        <text x="910" y="462">04 · Analyst Comms</text>
    </g>

    <text x="82" y="556" fill="#64748B" font-size="19">MIT licensed · vanilla JS + Tailwind CSS · no backend, no build-time secrets</text>
</svg>
